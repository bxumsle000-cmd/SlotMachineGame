# 資料庫連線設定
# 連的是 docker compose 起的 SQL Server 容器（見 docker-compose.yml）。
# 埠號 14333 是容器對外開的，不是本機安裝的那套 SQL Server（那套在 1433）。
# 用之前記得先啟動資料庫：docker compose up -d db db-init
#
# 註：app 本身跑在 compose 裡時，這三行會被 compose 的環境變數覆蓋成
#     jdbc:sqlserver://db:1433（走容器內部網路），連到的是同一個資料庫。
spring.datasource.url=jdbc:sqlserver://localhost:14333;databaseName=slot_game;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Slot_Game_1247
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Flyway 資料庫版本控管
# 啟動時自動掃 db/migration，把還沒跑過的 migration 依版本號執行
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 若連到的資料庫「已經有資料表但沒有 flyway_schema_history」，
# 就把它視為已經是 V1 的狀態並補記錄，不會重跑 V1（保護既有資料）。
# 全新的空資料庫不受影響，仍會正常從 V1 開始建表。
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# HikariCP 連線池設定
spring.datasource.hikari.pool-name=MyHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000